name: CI build and tests

# Builds the application and runs the xUnit suite against a throwaway PostgreSQL.
# The suite needs only the database; no IMAP server is required.

on:
  push:
    branches: ["feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: MailArchiver
          POSTGRES_USER: mailuser
          POSTGRES_PASSWORD: masterkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailuser -d MailArchiver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Read by TestDbFixture (prefix MailArchiverTest__).
      MailArchiverTest__ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=MailArchiver;Username=mailuser;Password=masterkey"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/MailArchiver.Tests/MailArchiver.Tests.csproj

      - name: Build
        run: dotnet build tests/MailArchiver.Tests/MailArchiver.Tests.csproj --no-restore -c Release

      - name: Test
        run: >-
          dotnet test tests/MailArchiver.Tests/MailArchiver.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/MailArchiver.Tests/TestResults/*.trx
